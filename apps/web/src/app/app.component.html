<div class="shell">
  <aside class="sidebar" [ngClass]="{ open: menuOpen() }">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="3" y="14" width="26" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 14 L11 7 H21 L25 14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="10" cy="24" r="2.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="22" cy="24" r="2.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Ironlot</div>
        <div class="brand-sub">Yard operations</div>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
        </span>
        <span>
          <strong>Dashboard</strong>
          <small>Live snapshot</small>
        </span>
      </a>
      <a routerLink="/cars" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 14h16l-1.5-5.5A2 2 0 0 0 16.6 7H7.4a2 2 0 0 0-1.9 1.5L4 14Z"/><path d="M4 14v4h2.5a2 2 0 1 0 4 0h3a2 2 0 1 0 4 0H20v-4"/></svg>
        </span>
        <span>
          <strong>Cars</strong>
          <small>Lot inventory</small>
        </span>
      </a>
      <a routerLink="/parts" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>
        </span>
        <span>
          <strong>Parts</strong>
          <small>Shelves & bins</small>
        </span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="foot-label">Workflow</div>
      <ol class="workflow">
        <li>Intake car</li>
        <li>Pull parts</li>
        <li>Price & sell</li>
      </ol>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" (click)="toggleMenu()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-copy">
        <div class="topbar-title">Scrapyard inventory</div>
        <div class="topbar-meta">Cars · parts · yard locations</div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-secondary" routerLink="/cars">Add car</a>
        <a class="btn btn-primary" routerLink="/parts">Add part</a>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  @if (menuOpen()) {
    <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }
</div>
