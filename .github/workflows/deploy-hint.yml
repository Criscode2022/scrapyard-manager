name: Neon connection check

# Manual smoke test of the production environment secret.
# Prefer the full Deploy production workflow for real deploys.

on:
  workflow_dispatch:

jobs:
  check-db:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API (for pg)
        run: npm ci --legacy-peer-deps
        working-directory: apps/api
      - name: Verify DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set on the production environment."
            exit 1
          fi
          echo "DATABASE_URL is present (value redacted)."
          node -e "const u=new URL(process.env.DATABASE_URL); console.log('Host:', u.hostname)"
      - name: Ping Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: apps/api
        run: |
          node -e "
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            await c.connect();
            const r = await c.query('select now() as now');
            console.log('Neon ping OK', r.rows[0]);
            await c.end();
          })().catch(e => { console.error(e); process.exit(1); });
          "
