name: Deploy production

# Uses the GitHub Environment "production" so DATABASE_URL is injected.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build · Neon · Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.final_url.outputs.url }}
    permissions:
      contents: read
      deployments: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set on the production environment."
            echo "Repo → Settings → Environments → production → Environment secrets"
            exit 1
          fi
          node -e "const u=new URL(process.env.DATABASE_URL); console.log('Neon host:', u.hostname)"

      - name: Install API deps
        run: npm ci --legacy-peer-deps
        working-directory: apps/api

      - name: Install Web deps
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web

      - name: Stage deploy artifacts
        run: node scripts/prepare-deploy.cjs

      - name: Bootstrap Neon (schema + seed)
        run: node scripts/bootstrap-neon.cjs

      - name: Create GitHub deployment
        id: gh_deploy
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Scrapyard manager production deploy',
            });
            if (deployment.status >= 400) {
              core.setFailed(`createDeployment failed: ${deployment.status}`);
              return;
            }
            core.setOutput('deployment_id', deployment.data.id);

      - name: Deploy to Vercel (optional)
        id: vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@39
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Resolve deployment URL
        id: final_url
        run: |
          if [ -n "${{ steps.vercel.outputs.url }}" ]; then
            echo "url=${{ steps.vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            # No Vercel token — mark success against the repo (DB already live on Neon)
            echo "url=https://github.com/${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL/Neon is live. Add VERCEL_TOKEN (+ ORG/PROJECT IDs) on the production environment to publish the app URL."
          fi

      - name: Mark GitHub deployment success
        if: always() && steps.gh_deploy.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.gh_deploy.outputs.deployment_id }},
              state,
              environment_url: '${{ steps.final_url.outputs.url }}' || undefined,
              description: state === 'success'
                ? 'Neon bootstrapped; production environment ready'
                : 'Deploy failed',
            });
