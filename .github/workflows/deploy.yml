name: Deploy production

# Uses GitHub Environment "production" so DATABASE_URL is injected.
# Optionally syncs DATABASE_URL to Vercel when VERCEL_TOKEN is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build · Neon · Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.final_url.outputs.url }}
    permissions:
      contents: read
      deployments: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Pre-filled from Vercel connector project (override via secrets if needed)
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID || 'team_XDogXucjsiIPPOiJSxbMGbSc' }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID || 'prj_0ZbozsuEfqvzYYY7bxuo5xnwGzTx' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set on the production environment."
            exit 1
          fi
          node -e "const u=new URL(process.env.DATABASE_URL); console.log('Neon host:', u.hostname)"

      - name: Install API deps
        run: npm ci --legacy-peer-deps
        working-directory: apps/api

      - name: Install Web deps
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web

      - name: Stage deploy artifacts
        run: node scripts/prepare-deploy.cjs

      - name: Bootstrap Neon (schema + seed)
        run: node scripts/bootstrap-neon.cjs

      - name: Sync DATABASE_URL to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          PROJECT="${VERCEL_PROJECT}"
          TEAM="${VERCEL_TEAM_ID}"
          # Upsert: remove existing then create (API has no pure upsert for sensitive)
          EXISTING=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM}" || true)
          echo "Current env keys (names only):"
          echo "$EXISTING" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);(j.envs||[]).forEach(e=>console.log('-',e.key, (e.target||[]).join(',')));}catch(e){console.log('parse skip')}})"

          # Delete existing DATABASE_URL entries so we can recreate
          echo "$EXISTING" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',async()=>{
              try {
                const j=JSON.parse(d);
                const ids=(j.envs||[]).filter(e=>e.key==='DATABASE_URL').map(e=>e.id);
                for (const id of ids) {
                  console.log('Removing old env', id);
                  const r=await fetch('https://api.vercel.com/v9/projects/${PROJECT}/env/'+id+'?teamId=${TEAM}',{
                    method:'DELETE',
                    headers:{Authorization:'Bearer '+process.env.VERCEL_TOKEN}
                  });
                  console.log('delete', id, r.status);
                }
              } catch(e) { console.log(e); }
            });
          "

          # Create sensitive DATABASE_URL for production + preview
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/${PROJECT}/env?teamId=${TEAM}" \
            -d "$(node -e "console.log(JSON.stringify({key:'DATABASE_URL',value:process.env.DATABASE_URL,type:'sensitive',target:['production','preview'],comment:'Neon Postgres — synced from GitHub production environment'}))")")
          echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);if(j.error){console.error(j);process.exit(1)}console.log('Vercel env set:', j.created?.key||j.key||'ok', j.created?.type||j.type||'');}catch(e){console.log(d);process.exit(1)}})"
          echo "::notice::DATABASE_URL synced to Vercel project ${PROJECT}"

      - name: Deploy to Vercel
        id: vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@39
          export VERCEL_ORG_ID="${VERCEL_TEAM_ID}"
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Resolve deployment URL
        id: final_url
        run: |
          if [ -n "${{ steps.vercel.outputs.url }}" ]; then
            echo "url=${{ steps.vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://scrapyard-manager.vercel.app" >> "$GITHUB_OUTPUT"
            if [ -z "$VERCEL_TOKEN" ]; then
              echo "::notice::Add VERCEL_TOKEN to GitHub production secrets so Actions can push DATABASE_URL to Vercel and redeploy."
              echo "::notice::Or set DATABASE_URL manually: https://vercel.com/criscode2022s-projects/scrapyard-manager/settings/environment-variables"
            fi
          fi

      - name: Create GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Scrapyard production',
            });
            if (deployment.status < 400) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: '${{ steps.final_url.outputs.url }}',
                description: 'Neon ready; Vercel env sync if token present',
              });
            }
